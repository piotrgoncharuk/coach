[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA: любой путь отдаёт оболочку, роутинг разбирает клиент.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service worker не кэшируем, иначе обновления не доедут.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
